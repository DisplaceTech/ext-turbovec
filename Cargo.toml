[package]
name          = "ext-turbovec"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.88"
license       = "MIT"
description   = "PHP 8.3+ native, in-process vector indexing and ANN search via TurboQuant."
repository    = "https://github.com/DisplaceTech/ext-turbovec"
readme        = "README.md"
publish       = false

[lib]
# The lib target shares its name with the upstream `turbovec` dependency on
# purpose: it makes the artifact `libturbovec.{so,dylib}` and the PHP module
# name `turbovec`, mirroring ext-infer's `libinfer` convention. Edition-2021
# name resolution keeps the two apart (our own crate is `crate::`, the
# dependency is `turbovec::`) — verified, not assumed.
name       = "turbovec"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.13"
# Pinned exactly: the on-disk index formats (.tv / .tvim) must stay stable
# across builds of the same ext-turbovec release. Bump deliberately and
# document format compatibility in the release notes (see README).
turbovec   = "=0.9.0"
thiserror  = "=2.0.18"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
